    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        value: SYNAPSE_VIRTUAL_IA_2026_SECRET_KEY
      # Aquí van las variables exactas que lee tu app.py
