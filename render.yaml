        value: root
      - key: MYSQL_PASSWORD
        value: "BJmwBrWfHRhbddiUzsZFwUWFAxQEUDNO"
      - key: MYSQL_DB
        value: railway
      - key: PYTHON_VERSION
        value: 3.10.12