{% extends "base.html" %}

{% block title %}Nueva Calificación · Synapse Virtual IA{% endblock %}
{% block page_title %}➕ Nueva Calificación{% endblock %}

{% block content %}
    <div style="max-width: 600px; margin: 0 auto;">
        <form method="POST" class="form-consulta">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color:#ffffff;">Estudiante</label>
                <select name="estudiante_id" class="form-control" required style="width:100%; padding: 12px; border-radius: 30px; background: #1a1a2e; color: #fff; border: 2px solid #1f4e79;">
                    <option value="">Seleccionar estudiante</option>
                    {% for e in estudiantes %}
                        <option value="{{ e.id }}">{{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color:#ffffff;">Materia</label>
                <select name="materia_id" class="form-control" required style="width:100%; padding: 12px; border-radius: 30px; background: #1a1a2e; color: #fff; border: 2px solid #1f4e79;">
                    <option value="">Seleccionar materia</option>
                    {% for m in materias %}
                        <option value="{{ m.id }}">{{ m.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color:#ffffff;">Lapso</label>
                <select name="lapso" class="form-control" required style="width:100%; padding: 12px; border-radius: 30px; background: #1a1a2e; color: #fff; border: 2px solid #1f4e79;">
                    <option value="">Seleccionar lapso</option>
                    {% for l in lapsos %}
                        <option value="{{ l }}">{{ l }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color:#ffffff;">Nota (0 - 20)</label>
                <input type="number" name="nota" placeholder="Ej: 15.5" step="0.1" min="0" max="20" required style="width:100%; padding: 12px; border-radius: 30px; background: #1a1a2e; color: #fff; border: 2px solid #1f4e79;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color:#ffffff;">Observación (opcional)</label>
                <input type="text" name="observacion" placeholder="Observación de la calificación" style="width:100%; padding: 12px; border-radius: 30px; background: #1a1a2e; color: #fff; border: 2px solid #1f4e79;">
            </div>
            <button type="submit" class="btn-submit">Guardar Calificación</button>
            <a href="{{ url_for('admin.listar_calificaciones') }}" class="btn-volver" style="margin-left:10px;">Cancelar</a>
        </form>
    </div>
{% endblock %}
