<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Verificar Código</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<header class="header">
		<div class="logo"><img src="{{ url_for('static', filename='img/logo.png') }}" width="120" alt="Logo"></div>
		<h1>🧠 Synapse Virtual IA</h1>
	</header>
	<main class="contenido-interno">
		<h2>Verificar Código</h2>
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
				<div class="flash-messages">
					{% for category, message in messages %}
						<div class="flash {{ category }}">{{ message }}</div>
					{% endfor %}
				</div>
			{% endif %}
		{% endwith %}
		<form method="POST">
			<input type="hidden" name="correo" value="{{ correo or '' }}">
			<input type="text" name="codigo" placeholder="Código de 6 dígitos" required maxlength="6" pattern="\d{6}" title="Ingrese un código de 6 dígitos">
			<button type="submit">Verificar</button>
		</form>
		<!-- ✅ CORREGIDO: recuperar → auth.recuperar -->
		<p><a href="{{ url_for('auth.recuperar') }}">Reenviar código</a></p>
	</main>
	<footer class="footer"><hr><p>Synapse Virtual IA</p></footer>
</body>
</html>
