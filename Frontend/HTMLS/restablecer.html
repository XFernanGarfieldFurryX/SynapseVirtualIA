<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="header">
        <div class="logo"><img src="{{ url_for('static', filename='img/logo.png') }}" width="120"></div>
        <h1>🧠 Synapse Virtual IA</h1>
    </header>
    <main class="contenido-interno">
        <h2>Nueva Contraseña</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="password" placeholder="Nueva contraseña (mínimo 6 caracteres)" required>
            <input type="password" name="confirmar_password" placeholder="Confirmar contraseña" required>
            <button type="submit">Actualizar</button>
        </form>
    </main>
    <footer class="footer"><hr><p>Synapse Virtual IA</p></footer>
</body>
</html>
